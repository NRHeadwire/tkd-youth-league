// ============================================================
// Toast notifications & Confirm dialog
// ============================================================
const TOAST_ICONS = { success: '\u2714', error: '\u2718', info: '\u2139', warning: '\u26A0' };

function showToast(message, type = 'success', duration = 3000) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.innerHTML = `<span class="toast-icon">${TOAST_ICONS[type] || ''}</span><span class="toast-msg">${escHtml(message)}</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'toastOut 0.3s ease-in forwards';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function showConfirm(message, onConfirm) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <h2>${lang === 'de' ? 'Best\u00e4tigung' : 'Confirm'}</h2>
    <p style="margin-bottom:20px;line-height:1.5">${escHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">${lang === 'de' ? 'Abbrechen' : 'Cancel'}</button>
      <button class="btn btn-accent" id="confirmBtn">${lang === 'de' ? 'Ja, fortfahren' : 'Yes, proceed'}</button>
    </div>
  `;
  document.getElementById('confirmBtn').onclick = function() { closeModal(); onConfirm(); };
  overlay.classList.add('show');
}

// ============================================================
// Event Management
// ============================================================
function showEventMenu() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <h2>${t('event.menu')}</h2>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card" style="margin:0;cursor:pointer;border:2px solid var(--border);transition:border-color 0.2s" onclick="this.style.borderColor='var(--primary)'" onmouseenter="this.style.borderColor='var(--primary-light)'" onmouseleave="this.style.borderColor='var(--border)'">
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="saveEvent()">
          ${t('event.saveEvent')}
        </button>
        <p style="font-size:0.85rem;color:var(--text-light);margin-top:8px">${t('event.saveHint')}</p>
      </div>
      <div class="card" style="margin:0;cursor:pointer;border:2px solid var(--border);transition:border-color 0.2s" onmouseenter="this.style.borderColor='var(--primary-light)'" onmouseleave="this.style.borderColor='var(--border)'">
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="document.getElementById('loadEventFile').click()">
          ${t('event.loadEvent')}
        </button>
        <input type="file" id="loadEventFile" accept=".json,.tkd" style="display:none" onchange="loadEvent(this)" />
        <p style="font-size:0.85rem;color:var(--text-light);margin-top:8px">${t('event.loadHint')}</p>
      </div>
      <div class="card" style="margin:0;cursor:pointer;border:2px solid var(--border);transition:border-color 0.2s" onmouseenter="this.style.borderColor='var(--accent)'" onmouseleave="this.style.borderColor='var(--border)'">
        <button class="btn btn-accent" style="width:100%;justify-content:center" onclick="newEvent()">
          ${t('event.newEvent')}
        </button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">${t('event.cancel')}</button>
    </div>
  `;
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function saveEvent() {
  const eventData = {
    _format: 'tkd-youth-league-event',
    _version: 1,
    _savedAt: new Date().toISOString(),
    ...state
  };
  const json = JSON.stringify(eventData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const name = (state.competition.name || 'TKD-Event').replace(/[^a-zA-Z0-9_-]/g, '_');
  const date = state.competition.date || new Date().toISOString().split('T')[0];
  a.href = url;
  a.download = `${name}_${date}.tkd.json`;
  a.click();
  URL.revokeObjectURL(url);
  closeModal();
}

function loadEvent(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      // Validate it looks like an event file
      if (!data.participants && !data.competition) {
        showToast('Invalid event file', 'error');
        return;
      }
      // Remove metadata fields
      delete data._format;
      delete data._version;
      delete data._savedAt;
      // Merge with defaults to fill any missing fields
      const def = defaultState();
      state = { ...def, ...data };
      if (!state.results) state.results = def.results;
      DISCIPLINES.forEach(d => { if (!state.results[d]) state.results[d] = {}; });
      if (!state.settings) state.settings = def.settings;
      if (!state.settings.formScoring) state.settings.formScoring = def.settings.formScoring;
      if (!state.settings.placementPoints) state.settings.placementPoints = def.settings.placementPoints;
      saveState();
      closeModal();
      render();
      showToast(t('event.loaded'), 'success');
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function newEvent() {
  showConfirm(t('event.newConfirm'), () => {
    state = defaultState();
    saveState();
    currentTab = 'dashboard';
    render();
    showToast(lang === 'de' ? 'Neuer Wettkampf gestartet' : 'New event started', 'info');
  });
}

function loadEventFromInput(input) {
  loadEvent(input);
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============================================================
// Init
// ============================================================
render();
</script>
</body>
</html>
